[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "Backtesting and paper-trading starter project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
trading-system = "trading_system.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
